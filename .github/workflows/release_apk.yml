name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build ARM64 Release APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --no-tree-shake-icons

      - name: Prepare APK file
        run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ai-video-edit-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-edit-arm64
          path: ai-video-edit-latest.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: Latest Auto-Build Release
          files: ai-video-edit-latest.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
